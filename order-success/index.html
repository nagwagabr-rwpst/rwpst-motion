<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تم استلام طلب الفيديو — RWPST MOTION">
  <meta name="robots" content="noindex, nofollow">
  <title>تم استلام طلبك — RWPST MOTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/project-request.css">
  <link rel="stylesheet" href="../assets/css/order.css">
</head>
<body class="pr-page">

  <header class="header pr-header" id="header">
    <nav class="nav container" aria-label="التنقل">
      <a href="../" class="nav__logo" aria-label="RWPST MOTION الرئيسية">
        <img src="../assets/logo/logo.png" alt="RWPST Motion" class="nav__logo-img" width="auto" height="70">
      </a>
    </nav>
  </header>

  <main class="pr-success">
    <div class="container">
      <div class="pr-success__card">
        <div class="pr-success__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h1 class="pr-success__title">تم استلام طلبك بنجاح 🎉</h1>
        <p class="pr-success__text">شكرًا لك. سنراجع بيانات مطعمك والصور المرسلة ونبدأ تجهيز الفيديو.</p>
        <p class="pr-success__ref" id="submissionRef" hidden>
          رقم الطلب: <span id="submissionId"></span>
        </p>
        <p class="pr-success__text">لو لم ترسل الصور أو تريد إضافة تفاصيل، يمكنك التواصل معنا على واتساب.</p>
        <div class="pr-success__actions">
          <a
            href="https://wa.me/201006786392"
            class="btn btn--primary btn--whatsapp"
            id="whatsappCta"
            target="_blank"
            rel="noopener noreferrer"
          >تواصل عبر واتساب</a>
          <a href="../" class="btn btn--secondary">العودة للرئيسية</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">&copy; <span id="year"></span> RWPST MOTION. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      const header = document.getElementById('header');
      if (header) {
        const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 20);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      }

      const requestNumber = sessionStorage.getItem('rwpst_last_request_number');
      const refEl = document.getElementById('submissionRef');
      const idEl = document.getElementById('submissionId');
      if (requestNumber && refEl && idEl) {
        idEl.textContent = requestNumber;
        refEl.hidden = false;
      }

      const link = document.getElementById('whatsappCta');
      if (link) {
        const lines = ['مرحباً RWPST MOTION،', '', 'أرسلت طلب أول فيديو تجريبي.'];
        if (requestNumber) lines.push('رقم الطلب: ' + requestNumber);
        lines.push('', 'أريد إضافة تفاصيل أو صور.');
        link.href = 'https://wa.me/201006786392?text=' + encodeURIComponent(lines.join('\n'));
      }
    })();
  </script>
</body>
</html>
